<!-- =============================================================================
FILE: index.html
PATH: index.html
VERSION: 0.0.3
PURPOSE: Root HTML entry point for React + Electron.
         - loads index.css for global styles
         - mounts React via dist/bundle.js into #root
         - CSP: blocks external scripts, allows self + inline styles
============================================================================= -->

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self';
             img-src 'self' data:;
             style-src 'self' 'unsafe-inline';
             script-src 'self';
             connect-src *;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiWeb Manager</title>
  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <div id="root"></div>
  <script src="./dist/bundle.js"></script>
</body>
</html>
